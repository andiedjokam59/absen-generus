<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Absensi Generus</title>
    <!-- File Manifest agar bisa di-install di HP seperti aplikasi asli -->
    <link rel="manifest" href="manifest.json">
    <!-- Library Scanner Barcode -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <!-- Library Supabase untuk menghubungkan ke Database -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 15px; background-color: #f0f4f8; }
        .container { max-width: 550px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h2, h3 { text-align: center; color: #2c3e50; margin-top: 5px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #34495e; }
        input, select, button { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { background-color: #2563eb; color: white; border: none; cursor: pointer; font-weight: bold; margin-top: 5px; transition: 0.2s; }
        button:hover { background-color: #1d4ed8; }
        #reader { width: 100%; border-radius: 8px; overflow: hidden; background: #000; }
        .divider { text-align: center; margin: 20px 0; font-weight: bold; color: #94a3b8; }
        .status-box { padding: 12px; background: #dcfce7; color: #15803d; border-radius: 8px; text-align: center; font-weight: bold; margin-top: 15px; display: none; }
        .net-status { text-align: center; font-weight: bold; font-size: 14px; margin-bottom: 15px; padding: 5px; border-radius: 5px; }
        .online { background-color: #dcfce7; color: #16a34a; }
        .offline { background-color: #fee2e2; color: #dc2626; }
    </style>
</head>
<body>

<div class="container">
    <div id="network-indicator" class="net-status online">Status: Terhubung Internet (Online)</div>
    <h2>Absensi Pertemuan Generus</h2>
    
    <div class="form-group">
        <label for="kegiatan">Nama Kegiatan / Pertemuan:</label>
        <input type="text" id="kegiatan" placeholder="Contoh: Pengajian Rutin 2026">
    </div>

    <h3>[ Opsi 1: Scan Barcode / QR ]</h3>
    <div id="reader"></div>

    <div class="divider">ATAU</div>

    <h3>[ Opsi 2: Input Manual ]</h3>
    <div class="form-group">
        <label for="manual-select">Pilih Nama Generus (Jika Barcode Rusak):</label>
        <select id="manual-select">
            <option value="">-- Memuat Data Generus... --</option>
        </select>
    </div>
    <button onclick="inputManualKehadiran()">Input Kehadiran Manual</button>

    <div id="status-notif" class="status-box"></div>
</div>

<script>
    // ISI DENGAN DATA DARI SUPABASE ANDA
    const SUPABASE_URL = "https://gttavghryoadthnvwthd.supabase.co/rest/v1/"; 
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd0dGF2Z2hyeW9hZHRobnZ3dGhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5MDI5NDQsImV4cCI6MjA5NjQ3ODk0NH0.0O7I9EqSaiQq8_LKMJS9U-XDuitY6sPfYQVtBsJAeas";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Ambil elemen HTML
    const netIndicator = document.getElementById('network-indicator');
    const selectGenerus = document.getElementById('manual-select');

    // Indikator Status Internet Online/Offline
    window.addEventListener('online', () => {
        netIndicator.innerText = "Status: Terhubung Internet (Online)";
        netIndicator.className = "net-status online";
        kirimDataTertunda(); // Sinkronisasi otomatis saat internet kembali ada
    });
    window.addEventListener('offline', () => {
        netIndicator.innerText = "Status: Offline (Data disimpan lokal di HP)";
        netIndicator.className = "net-status offline";
    });

    // Ambil data nama generus dari Supabase untuk Dropdown Manual
    async function muatDaftarGenerus() {
        try {
            let { data: generus, error } = await _supabase.from('data_generus').select('id_generus, nama, kelompok');
            if (error) throw error;
            
            selectGenerus.innerHTML = '<option value="">-- Pilih Nama --</option>';
            generus.forEach(g => {
                let opt = document.createElement('option');
                opt.value = g.id_generus;
                opt.innerText = `${g.nama} (${g.kelompok || '-'})`;
                selectGenerus.appendChild(opt);
            });
        } catch (e) {
            // Jika offline, coba muat dari data cadangan lokal jika ada
            selectGenerus.innerHTML = '<option value="">Gagal memuat data cloud (Anda sedang offline)</option>';
        }
    }
    muatDaftarGenerus();

    // Kamera Scanner Barcode
    function onScanSuccess(decodedText) {
        prosesAbsensi(decodedText, "Scan Barcode");
    }
    let html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
    html5QrcodeScanner.render(onScanSuccess);

    // Fungsi Utama Memproses Absen (Mendukung Sistem Offline)
    async function prosesAbsensi(idGenerus, metode) {
        let namaKegiatan = document.getElementById('kegiatan').value;
        if(!namaKegiatan) {
            alert("Harap isi Nama Kegiatan terlebih dahulu!");
            return;
        }

        const dataAbsen = {
            nama_kegiatan: namaKegiatan,
            id_generus: idGenerus,
            metode_input: metode,
            waktu_absen: new Date().toISOString()
        };

        if (navigator.onLine) {
            // JIKA ONLINE: Langsung kirim ke Supabase
            let { error } = await _supabase.from('absensi_kegiatan').insert([dataAbsen]);
            if (!error) {
                tampilkanNotif(`Sukses Absen Langsung ke Cloud! ID: ${idGenerus}`);
            } else {
                simpanLokal(dataAbsen);
            }
        } else {
            // JIKA OFFLINE: Simpan di memori browser HP terlebih dahulu
            simpanLokal(dataAbsen);
        }
    }

    function simpanLokal(data) {
        let antrean = JSON.parse(localStorage.getItem('antrean_absensi')) || [];
        antrean.push(data);
        localStorage.setItem('antrean_absensi', JSON.stringify(antrean));
        tampilkanNotif(`Offline! Absen ID: ${data.id_generus} disimpan sementara di HP.`);
    }

    // Fungsi Mengirim Data yang Tertunda saat Internet kembali Aktif
    async function kirimDataTertunda() {
        let antrean = JSON.parse(localStorage.getItem('antrean_absensi')) || [];
        if (antrean.length === 0) return;

        netIndicator.innerText = "Sedang menyinkronkan data tertunda ke server...";
        
        for (let i = 0; i < antrean.length; i++) {
            await _supabase.from('absensi_kegiatan').insert([antrean[i]]);
        }

        localStorage.removeItem('antrean_absensi'); // Kosongkan antrean lokal jika sukses
        netIndicator.innerText = "Status: Terhubung Internet (Online) - Sinkronisasi Selesai!";
        tampilkanNotif("Semua data offline berhasil diunggah ke server pusat!");
    }

    function inputManualKehadiran() {
        let idTerpilih = selectGenerus.value;
        if(!idTerpilih) return alert("Pilih nama generus!");
        prosesAbsensi(idTerpilih, "Manual");
    }

    function tampilkanNotif(pesan) {
        let box = document.getElementById('status-notif');
        box.style.display = "block";
        box.innerText = pesan;
        setTimeout(() => box.style.display = "none", 5000);
    }

    // Daftarkan PWA Service Worker agar aplikasi bisa dibuka offline
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('service-worker.js');
    }
</script>
</body>
</html>
