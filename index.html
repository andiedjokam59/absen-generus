<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistem Presensi Kegiatan</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #047857; --primary-hover: #065f46; --accent: #d97706; --bg-main: #f8fafc; 
            --bg-card: #ffffff; --text-dark: #0f172a; --text-muted: #64748b; --border-color: #e2e8f0;
            --success: #10b981; --shadow: rgba(15, 23, 42, 0.04); --warning: #eab308;
        }

        /* Modal Custom Style (Menggantikan Alert Bawaan) */
        .custom-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); z-index: 99999; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(4px); }
        .custom-modal-box { background: var(--bg-card); padding: 32px; border-radius: 24px; text-align: center; max-width: 320px; width: 90%; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2); }
        .modal-icon { font-size: 60px; margin-bottom: 16px; }
        .modal-title { font-size: 20px; font-weight: 800; color: #ef4444; margin-bottom: 12px; }
        .modal-desc { font-size: 16px; color: var(--text-dark); margin-bottom: 24px; line-height: 1.5; }
        .modal-btn { width: 100%; padding: 14px; background: #ef4444; color: #fff; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; font-size: 16px; }

        body { font-family: 'Inter', sans-serif; margin: 0; padding: 0; background-color: var(--bg-main); color: var(--text-dark); display: flex; justify-content: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 440px; background: var(--bg-card); padding: 32px 24px; border-radius: 24px; box-shadow: 0 10px 25px -5px var(--shadow); margin: 16px; }
        input, .btn-primary, .btn-warning { width: 100%; padding: 14px; margin-top: 8px; border: 1px solid var(--border-color); border-radius: 12px; box-sizing: border-box; }
        .btn-primary { background: var(--primary); color: #fff; border: none; cursor: pointer; font-weight: 600; }
        .btn-warning { background: var(--warning); color: #0f172a; border: none; cursor: pointer; font-weight: 600; }
        #reader { width: 100%; border-radius: 16px; overflow: hidden; margin-top: 15px; }
        .action-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin-top: 10px; }
        .btn-icon { background: transparent; border: 1px solid var(--border-color); padding: 10px 0; border-radius: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 9px; font-weight: 600; width: 100%; }
        #print-area { display: none; }
    </style>
</head>
<body onclick="bukaKunciAudioKonstruktor()">

<div class="app-container">
    <h2>Presensi Kegiatan</h2>
    <input type="text" id="kegiatan" placeholder="NAMA AGENDA..." oninput="this.value = this.value.toUpperCase();">
    <div id="reader"></div>
    <input type="text" id="search-input" placeholder="Cari nama...">
    <input type="hidden" id="selected-id-generus">
    <button class="btn-primary" onclick="inputManualKehadiran()">Konfirmasi Kehadiran</button>
    <button class="btn-warning" onclick="inputManualIziin()">Izin</button>

    <div class="action-row">
        <button class="btn-icon" onclick="tarikDanCetakLaporan('semua')">Semua</button>
        <button class="btn-icon" onclick="tarikDanCetakLaporan('desa')">Desa</button>
        <button class="btn-icon" onclick="tarikDanCetakLaporan('kelompok')">Klp</button>
        <button class="btn-icon" onclick="sinkronisasiManual()">Simpan</button>
        <button class="btn-icon" onclick="eksporKeExcel()">Excel</button>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://gttavghryoadthnvwthd.supabase.co"; 
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd0dGF2Z2hyeW9hZHRobnZ3dGhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5MDI5NDQsImV4cCI6MjA5NjQ3ODk0NH0.0O7I9EqSaiQq8_LKMJS9U-XDuitY6sPfYQVtBsJAeas";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let globalAudioCtx = null;
    let semuaDataGenerus = [];

    function bukaKunciAudioKonstruktor() { if (!globalAudioCtx) globalAudioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    
    function bunyikanSuaraGagal() {
        try {
            let osc = globalAudioCtx.createOscillator(); let g = globalAudioCtx.createGain();
            osc.connect(g); g.connect(globalAudioCtx.destination);
            osc.type = 'sawtooth'; osc.frequency.value = 140; g.gain.value = 0.2;
            osc.start(); osc.stop(globalAudioCtx.currentTime + 0.2);
        } catch (e) {}
    }

    // FUNGSI CUSTOM ALERT (PENGGANTI ALERT BAWAAN)
    function tampilkanCustomAlert(pesan) {
        bunyikanSuaraGagal();
        let overlay = document.createElement('div');
        overlay.className = 'custom-modal-overlay';
        overlay.innerHTML = `
            <div class="custom-modal-box">
                <div class="modal-icon">❌</div>
                <div class="modal-title">GAGAL</div>
                <div class="modal-desc">${pesan}</div>
                <button class="modal-btn" onclick="this.parentElement.parentElement.remove()">MENGERTI</button>
            </div>`;
        document.body.appendChild(overlay);
    }

    async function prosesAbsensi(idGenerus, metode) {
        let namaKegiatan = document.getElementById('kegiatan').value.toUpperCase();
        if(!namaKegiatan) { tampilkanCustomAlert("Isi Nama Agenda terlebih dahulu!"); return; }
        
        let profil = semuaDataGenerus.find(g => g.id_generus == idGenerus) || { nama_lengkap: "ID: " + idGenerus };
        
        try {
            let { data: logTerakhir } = await _supabase
                .from('absensi_kegiatan')
                .select('waktu_absen')
                .eq('nama_kegiatan', namaKegiatan.trim())
                .eq('id_generus', idGenerus)
                .order('waktu_absen', { ascending: false })
                .limit(1);

            if (logTerakhir && logTerakhir.length > 0) {
                let selisihJam = (new Date() - new Date(logTerakhir[0].waktu_absen)) / (1000 * 60 * 60);
                if (selisihJam < 3) {
                    tampilkanCustomAlert(`${profil.nama_lengkap} sudah absen pada agenda ini. Silakan coba lagi nanti.`);
                    return;
                }
            }
            
            await _supabase.from('absensi_kegiatan').insert([{ 
                nama_kegiatan: namaKegiatan.trim(), 
                id_generus: idGenerus, 
                metode_input: metode, 
                waktu_absen: new Date().toISOString() 
            }]);
            // (Opsional: tambahkan toast sukses di sini)
        } catch (err) {
            tampilkanCustomAlert("Sistem error, coba ulangi lagi.");
        }
    }

    function inputManualKehadiran() { 
        let id = document.getElementById('selected-id-generus').value;
        if(!id) { tampilkanCustomAlert("Pilih nama anggota terlebih dahulu!"); return; }
        prosesAbsensi(id, "Manual"); 
    }
    
    function inputManualIziin() { 
        let id = document.getElementById('selected-id-generus').value;
        if(!id) { tampilkanCustomAlert("Pilih nama anggota terlebih dahulu!"); return; }
        prosesAbsensi(id, "Izin"); 
    }

    // Tambahkan kembali fungsi lainnya seperti: tarikDanCetakLaporan, eksporKeExcel, dll.
    // Pastikan setiap alert() diganti dengan tampilkanCustomAlert()
</script>
</body>
</html>
